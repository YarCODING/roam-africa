{% extends 'layouts/blank.html' %}
{% load static %}

{% block content %}

<section class="relative h-screen w-full -mt-18 overflow-hidden flex items-center justify-center text-white">
  
  <video 
    autoplay 
    loop 
    muted 
    playsinline 
    poster="{% static 'images/video-poster.png' %}"
    class="absolute inset-0 w-full h-full object-cover z-0"
  >
    <source src="{% static 'videos/africa-hero.mp4' %}" type="video/mp4" />
    Ваш браузер не підтримує відео.
  </video>

  <div class="absolute inset-0 bg-black/40 bg-linear-to-t from-black/80 via-black/20 to-black/50 z-10"></div>

  <div class="relative z-20 container mx-auto px-6 text-center">
    <span class="text-amber-400 font-semibold tracking-widest uppercase text-xs md:text-sm mb-6 block">
      Експедиції та авторські тури
    </span>
    
    <h1 class="text-2xl! sm:text-4xl! md:text-6xl! lg:text-8xl! font-black! uppercase text-white mb-6 tracking-wider">
      Відкрий для себе <span class="text-transparent bg-clip-text bg-linear-to-r from-primary to-accent">справжню Африку</span> 
    </h1>
    
    <p class="text-lg md:text-xl text-gray-200 mb-8 max-w-2xl mx-auto font-light">
      Складні віддалені напрямки, організація найвищого рівня та близьке за цінностями коло людей
    </p>

    <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
      <a href="#" class="w-full sm:w-auto px-8 py-4 bg-amber-500 hover:bg-amber-600 text-black font-medium rounded-full transition duration-300">
        Обрати напрямок
      </a>
      <a href="#" class="w-full sm:w-auto px-8 py-4 border border-white/40 hover:bg-white/10 text-white rounded-full transition duration-300 backdrop-blur-sm">
        Про наші тури
      </a>
    </div>
  </div>

</section>

{% endblock %}
