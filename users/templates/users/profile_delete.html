{% extends 'layouts/box.html' %}

{% block content %}

<h1 class="text-2xl font-bold mb-2">Видалити акаунт</h1>
<p class="text-base-content/80">Ви впевнені, що хочете видалити свій акаунт?</p>

<form method="POST">
    {% csrf_token %}
    <div class="mt-6 flex items-center">
        <button type="submit" class="btn btn-error">Так, я хочу видалити акаунт</button>
        <a class="btn btn-ghost ml-2" href="{{ request.META.HTTP_REFERER }}">Скасувати</a>
    </div>
</form>

{% endblock %}
