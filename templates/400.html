{% extends 'layouts/blank.html' %}

{% block content %}
<div class="min-h-[calc(100vh-100px)] bg-base-100 flex items-center justify-center py-12">
    <div class="hero-content flex-col lg:flex-row-reverse gap-12 max-w-5xl px-4">

        <div class="w-full lg:w-1/2 relative">
            <div class="rounded-xl overflow-hidden aspect-video lg:aspect-square">
                <img src="https://images.unsplash.com/photo-1524661135-423995f22d0b" 
                     alt="Некоректний запит" 
                     class="w-full h-full object-cover opacity-90" />
            </div>
        </div>

        <div class="w-full lg:w-1/2 text-center lg:text-left">
            <div class="relative">
                <span class="text-8xl sm:text-9xl font-black text-error/25 select-none block leading-none">
                    400
                </span>
                <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight mb-4 relative z-10">
                    Неправильно складений маршрут
                </h1>
            </div>
            
            <p class="text-base-content/70 mb-8 text-base sm:text-lg">
                Сервер не зміг розпізнати ваш запит через пошкоджені дані або невірне посилання. Перевірте адресу та спробуйте знову.
            </p>

            <div class="flex flex-col sm:flex-row gap-3 justify-center lg:justify-start">
                <a href="/" class="btn btn-primary gap-2 shadow-lg">
                    <i class="fa-solid fa-house"></i> На головну
                </a>
                <a href="{% url 'tour_list' %}" class="btn btn-outline gap-2">
                    <i class="fa-solid fa-person-hiking"></i> Обрати тур
                </a>
            </div>
        </div>

    </div>
</div>
{% endblock %}
