{% load static %}

<header class="sticky top-2 z-40 px-4 md:px-8">
    <div class="navbar bg-base-200 text-base-content rounded-full shadow-md px-6 min-h-16">
        
        <div class="navbar-start">
            <a class="flex items-center gap-2" href="{% url 'home' %}">
                <img class="h-8" src="{% static 'images/logo.png' %}" alt="Logo"/>
                <div class="flex flex-col">
                    <span class="text-lg font-bold font-heading tracking-tight leading-tight">Roam Africa</span>
                    <span class="text-md font-semibold text-primary leading-[0.9]"> Expeditions </span>
                </div>
            </a>
        </div>

        <div class="navbar-center hidden lg:flex">
            <ul class="menu menu-horizontal px-1 gap-4 font-medium uppercase tracking-wider text-xs">
                <li><a href="#" class="hover:text-primary transition-colors">Подорожі</a></li>
                <li><a href="#" class="hover:text-primary transition-colors">Відгуки</a></li>
                <li><a href="#" class="hover:text-primary transition-colors">Про нас</a></li>
                <li><a href="#" class="hover:text-primary transition-colors">Блог</a></li>
            </ul>
        </div>


        <div class="navbar-end gap-2">
            <label class="toggle text-base-content">
                <input type="checkbox" id="theme-toggle" />
                <i class="fa-solid fa-sun text-[10px] w-3.5 h-3.5 flex items-center justify-center"></i>
                <i class="fa-solid fa-moon text-[10px] w-3.5 h-3.5 flex items-center justify-center"></i>
            </label>

            {% if request.user.is_authenticated %}
                <div class="relative" id="user-dropdown">
                    <button type="button" id="dropdown-btn" class="btn btn-outline rounded-full px-5 min-h-10 h-10 flex items-center gap-2 text-xs font-semibold uppercase tracking-wider border-base-content/30 hover:bg-base-content hover:text-base-100 transition-all">
                        <img class="h-6 w-6 rounded-full object-cover" src="{{ user.avatar }}" alt="Avatar"/>
                        <span>{{ user.name }}</span>
                        <i id="dropdown-arrow" class="fa-solid fa-chevron-down text-[10px] transition-transform duration-300"></i>
                    </button>
                    
                    <div id="dropdown-menu" class="hidden absolute right-0 mt-2 bg-base-100 text-base-content shadow-lg rounded-2xl w-52 p-2 z-50 border border-base-300">
                        <ul class="menu menu-sm">
                            <li><a href="{% url 'profile' %}"><i class="fa-regular fa-user"></i> Мій профіль</a></li>
                            <li><a href="{% url 'profile-edit' %}"><i class="fa-solid fa-pen-to-square"></i> Редагувати профіль</a></li>
                            <li><a href="{% url 'profile-settings' %}"><i class="fa-solid fa-gear"></i> Налаштування</a></li>
                            <div class="divider my-1"></div>
                            <li><a href="{% url 'account_logout' %}" class="text-error"><i class="fa-solid fa-right-from-bracket"></i> Вийти</a></li>
                        </ul>
                    </div>
                </div>
            {% else %}
                <a href="{% url 'account_login' %}" class="btn btn-ghost btn-sm rounded-full uppercase text-xs">Увійти</a>
                <a href="{% url 'account_signup' %}?next={% url 'profile-onboarding' %}" class="btn btn-outline btn-primary rounded-full px-6 min-h-10 h-10 text-xs uppercase tracking-wider">
                    Реєстрація
                </a>
            {% endif %}
        </div>
        
    </div>
</header>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const btn = document.getElementById('dropdown-btn');
        const menu = document.getElementById('dropdown-menu');
        const arrow = document.getElementById('dropdown-arrow');

        if (btn && menu) {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                menu.classList.toggle('hidden');
                arrow?.classList.toggle('rotate-180');
            });

            document.addEventListener('click', (e) => {
                if (!menu.contains(e.target) && !btn.contains(e.target)) {
                    menu.classList.add('hidden');
                    arrow?.classList.remove('rotate-180');
                }
            });
        }
    });
</script>
