<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
</head>
<body style="margin: 0; padding: 0; background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #111111;">
    
    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="table-layout: fixed; background-color: #ffffff; padding: 40px 0;">
        <tr>
            <td align="center">
                <table border="0" cellpadding="0" cellspacing="0" width="600" style="max-width: 600px; width: 100%; text-align: left;">
                    
                    <tr>
                        <td style="padding: 0 20px 30px 20px;">
                            <img src="https://res.cloudinary.com/dslogjiwv/image/upload/logo_full_gyexl7.png" alt="Roam Africa" width="220" style="display: block; border: 0; outline: none; text-decoration: none;">
                        </td>
                    </tr>

                    {% if image_url_public %}
                    <tr>
                        <td style="padding: 0 20px 20px 20px;">
                            <img src="{{ image_url_public }}" alt="Image" width="560" style="width: 100%; max-width: 560px; height: auto; border-radius: 6px; display: block; border: 0;">
                        </td>
                    </tr>
                    {% endif %}

                    <tr>
                        <td style="padding: 0 20px; font-size: 15px; line-height: 1.6; color: #333333;">
                            {{ body|safe }}
                        </td>
                    </tr>

                    <tr>
                        <td style="padding: 40px 20px 0 20px; border-top: 1px solid #eaeaea; margin-top: 40px;">
                            <p style="font-size: 13px; color: #666666; margin: 0 0 10px 0;">
                                ©2026 Roam Africa. All rights reserved.
                            </p>
                            <p style="font-size: 12px; color: #888888; margin: 0; line-height: 1.5;">
                                The email was sent to <a href="mailto:{{ email }}" style="color: #666666; text-decoration: underline;">{{ email }}</a>. To no longer receive these emails, <a href="{{ unsubscribe_url }}" style="color: #666666; text-decoration: underline;">unsubscribe here</a>.
                            </p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>

</body>
</html>
